services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: geonews
      POSTGRES_PASSWORD: geonews
      POSTGRES_DB: geonews
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geonews"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      GEONEWS_DATABASE_URL: postgresql+asyncpg://geonews:geonews@postgres:5432/geonews
      GEONEWS_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: ./backend
    command: ["uv", "run", "arq", "geonews.ingest.worker.WorkerSettings"]
    env_file: ./backend/.env
    environment:
      GEONEWS_DATABASE_URL: postgresql+asyncpg://geonews:geonews@postgres:5432/geonews
      GEONEWS_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  web:
    build: ./web
    environment:
      GEONEWS_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
