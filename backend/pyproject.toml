[project]
name = "geonews"
version = "0.1.0"
description = "Geo-aware news intelligence agent: ingestion, ranking, multi-agent Q&A, evals."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4",
    "mcp>=2.3",
    "fastapi>=0.162",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=3.6",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.5",
    "redis>=5.0",
    "arq>=0.28",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "datasketch>=1.6",
    "numpy>=1.26",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-exporter-otlp-proto-http>=1.26",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
]

[project.optional-dependencies]
embed = ["fastembed>=0.9"]
nlp = ["spacy>=3.7"]
ml = ["lightgbm>=4.3", "scikit-learn>=1.5", "pandas>=2.2"]
train = ["torch>=2.3", "transformers>=4.44", "peft>=0.12", "trl>=0.10", "datasets>=2.20"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
geonews-api = "geonews.api.main:run"
geonews-eval = "geonews_evals.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geonews", "geonews_evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
